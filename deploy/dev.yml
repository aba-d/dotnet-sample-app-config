# Release values for dotnet-sample-app in DEV.
# Contract: enterprise-ci-templates/policy/schema/deploy-config.schema.json (cd/v1)
# This file carries WHAT to run AND the AWS resource coordinates to run it
# against (infra: block). cd-template.yml reads these directly from this file.
apiVersion: cd/v1

service:
  name: dotnet-sample-app
  target: ecs                 # ecs | ec2 | lambda | s3

environment:
  name: dev

infra:
  region: us-east-1
  ecs:
    cluster: dotnet-sample-app-dev
    service: dotnet-sample-app-dev
    containerName: app
  ecr:
    repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/dotnet-sample-app

release:
  version: ""                 # empty = deploy the latest published artifact (dev only)
  strategy: rolling

runtime:
  desiredCount: 1
  containerPort: 8080
  env:
    ASPNETCORE_ENVIRONMENT: Development
  secrets:                    # names only — resolved from Secrets Manager at deploy time
    - ConnectionStrings__Default

scaling:
  min: 1
  max: 3
  targetCpu: 65

healthcheck:
  path: /health
