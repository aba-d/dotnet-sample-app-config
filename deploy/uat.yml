# Release values for dotnet-sample-app in UAT.
# Contract: enterprise-ci-templates/policy/schema/deploy-config.schema.json (cd/v1)
apiVersion: cd/v1

service:
  name: dotnet-sample-app
  target: ecs

environment:
  name: uat

infra:
  region: us-east-1
  ecs:
    cluster: dotnet-sample-app-uat
    service: dotnet-sample-app-uat
    containerName: app
  ecr:
    repository: 222222222222.dkr.ecr.us-east-1.amazonaws.com/dotnet-sample-app

release:
  version: ""                 # set by promotion (deploy workflow input) — required for uat
  strategy: rolling

runtime:
  desiredCount: 2
  containerPort: 8080
  env:
    ASPNETCORE_ENVIRONMENT: Staging
  secrets:
    - ConnectionStrings__Default

scaling:
  min: 2
  max: 6
  targetCpu: 60

healthcheck:
  path: /health
