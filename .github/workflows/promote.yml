name: promote

# Convenience: read the artifact version currently live in a lower environment
# and open the deploy for the next one, so nobody hand-copies image digests.
#   dev -> uat -> prod

on:
  workflow_dispatch:
    inputs:
      to:
        description: Promote INTO this environment
        type: choice
        options: [uat, prod]
        required: true

permissions:
  id-token: write
  contents: read
  actions: write        # to dispatch deploy.yml

jobs:
  resolve-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve source environment
        id: src
        run: |
          case "${{ inputs.to }}" in
            uat)  echo "from=dev" >> "$GITHUB_OUTPUT" ;;
            prod) echo "from=uat" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: aba-enterprise/enterprise-ci-templates/actions/preflight-deploy@feature-ciconfig
        id: from
        with:
          config-path: deploy
          environment: ${{ steps.src.outputs.from }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ steps.from.outputs.deploy_role }}
          role-session-name: ${{ steps.from.outputs.session_name }}
          aws-region:        ${{ steps.from.outputs.region }}

      - name: Read the version currently deployed in ${{ steps.src.outputs.from }}
        id: live
        env:
          PREFIX: ${{ steps.from.outputs.ssm_prefix }}
        run: |
          # <app>-infra publishes the running version under <prefix>/release/version
          # (written by cd-template.yml on every successful deploy).
          echo "NOTE: wire this to your source of truth (SSM param, ECS task-def tag, etc.)"
          echo "version=$(aws ssm get-parameter --name "$PREFIX/release/version" \
                 --query Parameter.Value --output text 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy into ${{ inputs.to }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "${{ steps.live.outputs.version }}" || { echo "::error::no version found in ${{ steps.src.outputs.from }}"; exit 1; }
          gh workflow run deploy.yml \
            -f environment=${{ inputs.to }} \
            -f version=${{ steps.live.outputs.version }}
